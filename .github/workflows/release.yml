name: Release e Atualização Automática

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Obter Versão do package.json
        id: get_version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Instalar Dependências
        run: npm install

      - name: Empacotar e Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Publicar Release Oficialmente no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.cjs

      - name: Garantir Upload de Todos os Arquivos da Release (Fail-Safe)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.version }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          draft: false

  # Publica o site/PWA no Firebase Hosting (job separado: se falhar, não afeta o instalador)
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts: o site não precisa de Electron nem dos módulos nativos do desktop
      - name: Instalar Dependências
        run: npm ci --ignore-scripts

      - name: Compilar Site (Vite)
        run: npx vite build

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sussurro-4ef44
          channelId: live
